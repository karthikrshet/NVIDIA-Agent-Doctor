[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nvidia-agent-doctor"
version = "0.1.0"
description = "Independent open-source diagnostic, security, compatibility and benchmarking toolkit for NVIDIA AI-agent environments."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA Agent Doctor Contributors" }]
keywords = [
    "nvidia",
    "cuda",
    "ai-agents",
    "gpu",
    "diagnostics",
    "mcp",
    "openshell",
    "nemotron",
    "machine-learning",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
    "PyYAML>=6.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-psutil>=5.9.0",
]
docker = ["docker>=7.0.0"]

[project.urls]
Homepage = "https://github.com/karthikrshet/nvidia-agent-doctor"
Repository = "https://github.com/karthikrshet/nvidia-agent-doctor"
Issues = "https://github.com/karthikrshet/nvidia-agent-doctor/issues"
Documentation = "https://github.com/karthikrshet/nvidia-agent-doctor/blob/main/docs/getting-started.md"

[project.scripts]
nad = "nvidia_agent_doctor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nvidia_agent_doctor"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "S",  # flake8-bandit (security)
    "T20", # flake8-print
]
ignore = [
    "S101",  # assert statements in tests
    "S603",  # subprocess call - we use it intentionally
    "S607",  # partial-path subprocess - we handle this
    "T201",  # print found - CLI tools use print via Rich
    "B008",  # Typer declares command parameters through default values
    "E501",  # Ruff formatter is authoritative for generated HTML and CLI strings
    "S105",  # "PASS" is a diagnostic status, not a credential
    "S110",  # Optional integration probes intentionally degrade gracefully
    "S112",  # Invalid optional configuration files are skipped during discovery
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gpu: marks tests requiring an NVIDIA GPU (deselect with '-m not gpu')",
    "slow: marks slow tests (deselect with '-m not slow')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src/nvidia_agent_doctor"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
