name: NVIDIA Agent Doctor

# Reusable workflow for NVIDIA Agent Doctor diagnostics.
# Standard GitHub-hosted runners DO NOT have NVIDIA GPUs.
# GPU-specific checks require self-hosted runners with NVIDIA hardware.
#
# Usage example in your project:
#
# jobs:
#   diagnose:
#     # Pin to an immutable NVIDIA Agent Doctor commit or release tag.
#     uses: karthikrshet/NVIDIA-Agent-Doctor/.github/workflows/nvidia-agent-doctor.yml@<commit-sha>
#     with:
#       gpu_required: false

on:
  workflow_call:
    inputs:
      gpu_required:
        description: "Fail if no GPU is detected"
        type: boolean
        default: false
      python_version:
        description: "Python version to use"
        type: string
        default: "3.11"
      skills_path:
        description: "Path to scan for agent skills (leave empty to skip)"
        type: string
        default: ""
    outputs:
      health_score:
        description: "Overall health score (0-100)"
        value: ${{ jobs.diagnose.outputs.health_score }}
      exit_code:
        description: "Exit code (0=healthy, 1=warnings, 2=errors, 3=security)"
        value: ${{ jobs.diagnose.outputs.exit_code }}

  workflow_dispatch:

jobs:
  diagnose:
    name: NVIDIA Agent Doctor
    runs-on: ubuntu-latest
    outputs:
      health_score: ${{ steps.parse_report.outputs.health_score }}
      exit_code: ${{ steps.run_doctor.outputs.exit_code }}
    permissions:
      contents: read

    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7
        with:
          path: target-repository
          persist-credentials: false

      - name: Check out the workflow's NVIDIA Agent Doctor source
        uses: actions/checkout@v7
        with:
          # A reusable workflow otherwise checks out the caller's repository.
          # workflow_sha binds this source to the exact commit containing this
          # workflow, avoiding an unrelated package or a moving branch ref.
          repository: karthikrshet/NVIDIA-Agent-Doctor
          ref: ${{ github.workflow_sha }}
          path: nvidia-agent-doctor
          persist-credentials: false

      - name: Set up Python ${{ inputs.python_version || '3.11' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.11' }}

      - name: Install checked-out NVIDIA Agent Doctor
        run: pip install -e nvidia-agent-doctor

      - name: Run nad doctor
        id: run_doctor
        run: |
          set +e
          nad doctor --json > nad-report.json
          EXIT_CODE=$?
          set -e
          python -m json.tool nad-report.json > /dev/null
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Doctor exit code: $EXIT_CODE"
          # A warning is useful diagnostic output. Errors, high-security
          # findings, and invalid configuration must fail the caller job.
          if [ "$EXIT_CODE" -gt 1 ]; then
            exit "$EXIT_CODE"
          fi
        working-directory: target-repository

      - name: Parse health score
        id: parse_report
        run: |
          SCORE=$(python -c "
          import json
          with open('nad-report.json') as f:
              data = json.load(f)
          print(data['summary']['overall_score'])
          ")
          echo "health_score=$SCORE" >> $GITHUB_OUTPUT
          echo "Health score: $SCORE"
        working-directory: target-repository

      - name: Run security scan
        run: |
          set +e
          nad security scan --json > nad-security.json
          EXIT_CODE=$?
          set -e
          python -m json.tool nad-security.json > /dev/null
          # Exit 1 means reviewable warnings. Do not hide errors, high-risk
          # findings, or invalid configuration with an unconditional success.
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "Security scan failed with exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "Security scan exit code: $EXIT_CODE"
        working-directory: target-repository

      - name: Scan skills
        if: ${{ inputs.skills_path != '' }}
        env:
          SKILLS_PATH: ${{ inputs.skills_path }}
        run: |
          set +e
          nad skills scan "$SKILLS_PATH" --json > nad-skills.json
          EXIT_CODE=$?
          set -e
          python -m json.tool nad-skills.json > /dev/null
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "Skills scan failed with exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "Skills scan exit code: $EXIT_CODE"
        working-directory: target-repository

      - name: Fail if GPU required but not found
        if: ${{ inputs.gpu_required == true }}
        run: |
          GPU_STATUS=$(python -c "
          import json
          with open('nad-report.json') as f:
              data = json.load(f)
          gpu_section = data.get('sections', {}).get('gpu', {})
          checks = gpu_section.get('checks', [])
          not_installed = any(c['severity'] == 'NOT_INSTALLED' for c in checks)
          print('not_installed' if not_installed else 'detected')
          ")
          if [ "$GPU_STATUS" == "not_installed" ]; then
            echo "ERROR: GPU required but not detected."
            exit 2
          fi
        working-directory: target-repository
