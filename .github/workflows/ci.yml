name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src/ tests/

      - name: Run type check (mypy)
        run: mypy src/nvidia_agent_doctor/
        continue-on-error: true  # Non-blocking for now

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not gpu and not slow" --no-cov

      - name: Run tests with coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pytest tests/ -v --tb=short -m "not gpu and not slow"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  diagnose:
    name: NVIDIA Agent Doctor Self-Diagnosis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install NVIDIA Agent Doctor
        run: pip install -e .

      - name: Run nad doctor (CPU/config mode)
        run: nad doctor --json 2>&1 | head -100
        # GPU checks will show NOT_INSTALLED on standard runners
        # This validates the CLI works and exits cleanly

      - name: Verify exit code is meaningful
        run: |
          nad doctor --json > /dev/null
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          # 0=healthy, 1=warnings, 2=errors - all are valid on non-GPU runner
          if [ $EXIT_CODE -gt 2 ]; then
            echo "Unexpected exit code: $EXIT_CODE"
            exit 1
          fi

      - name: Run security scan
        run: nad security scan --json

      - name: Run compatibility check
        run: nad compatibility check --json

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

      - name: Run lint
        run: ruff check src/ tests/
