name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distribution
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel and verify CLI entry point
        run: |
          python -m pip install --force-reinstall dist/*.whl
          nad --version

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src/ tests/

      - name: Run type check (mypy)
        run: mypy src/nvidia_agent_doctor/

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not gpu and not slow" --no-cov

      - name: Run tests with coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pytest tests/ -v --tb=short -m "not gpu and not slow"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  diagnose:
    name: NVIDIA Agent Doctor Self-Diagnosis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install NVIDIA Agent Doctor
        run: pip install -e .

      - name: Run nad doctor (CPU/config mode)
        run: |
          set +e
          nad doctor --json > nad-self-diagnosis.json
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          # 0=healthy, 1=warnings, 2=errors - all are valid on non-GPU runner
          if [ $EXIT_CODE -gt 2 ]; then
            echo "Unexpected exit code: $EXIT_CODE"
            exit 1
          fi
          python -m json.tool nad-self-diagnosis.json > /dev/null

      - name: Run security scan
        run: |
          set +e
          nad security scan --json > nad-security-scan.json
          EXIT_CODE=$?
          set -e
          python -m json.tool nad-security-scan.json > /dev/null
          # GitHub-hosted runners can legitimately have reviewable security
          # warnings (for example, managed environment credentials). Preserve
          # those as status 1 while failing diagnostic errors or high findings.
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "Security scan failed with exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "Security scan exit code: $EXIT_CODE"

      - name: Run compatibility check
        run: |
          set +e
          nad compatibility check --json > nad-compatibility.json
          EXIT_CODE=$?
          set -e
          python -m json.tool nad-compatibility.json > /dev/null
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "Compatibility check failed with exit code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "Compatibility check exit code: $EXIT_CODE"

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

      - name: Run lint
        run: ruff check src/ tests/
